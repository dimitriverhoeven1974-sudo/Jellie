<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02050a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Yellie v4.1 Ultimate</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#eaffff;font-family:system-ui,sans-serif;touch-action:none}body{background:radial-gradient(circle at 50% 40%,#173356 0,#07111e 45%,#02050a 100%)}
#app{position:relative;width:100%;height:100%;display:grid;place-items:center}.halo{position:absolute;width:min(85vw,800px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#4de9ff16 0 35%,transparent 36% 52%,#826aff10 53% 55%,transparent 56%);animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.04);opacity:.7}}
#face{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:clamp(55px,10vh,105px)}#eyes{display:flex;gap:clamp(32px,9vw,130px)}
.eye{position:relative;width:clamp(125px,26vw,300px);height:clamp(100px,21vw,235px);border:clamp(5px,1vw,11px) solid #62edff;border-radius:48% 48% 44% 44%/56% 56% 45% 45%;background:#04111d;overflow:hidden;box-shadow:0 0 18px #5deaff,0 0 55px #00c8ff77,inset 0 0 28px #59eaff55}.iris{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#02060a 0 26%,#c8ffff 28% 34%,#28dfff 36% 61%,#073a57 64% 100%);box-shadow:0 0 22px #52eaff;will-change:transform}.glint{position:absolute;left:22%;top:15%;width:22%;aspect-ratio:1;border-radius:50%;background:#fff}.lid{position:absolute;z-index:4;left:-3%;width:106%;height:54%;background:linear-gradient(#07111e,#11243a);transition:transform .12s}.lid.top{top:-2%;border-bottom:3px solid #55eaff;transform:translateY(-105%)}.lid.bottom{bottom:-2%;border-top:3px solid #55eaff;transform:translateY(105%)}.eye.blink .top{transform:translateY(0)}.eye.blink .bottom{transform:translateY(0)}
#mouth{width:clamp(115px,21vw,250px);height:clamp(24px,4vw,52px);border-bottom:clamp(7px,1.1vw,13px) solid #55eaff;border-radius:0 0 60% 60%;filter:drop-shadow(0 0 10px #55eaff)}#mouth.talk{animation:talk .18s infinite alternate ease-in-out}@keyframes talk{to{width:clamp(85px,17vw,200px);height:clamp(50px,8vw,88px);border:7px solid #55eaff;border-radius:50%;background:#03121d}}
#status{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:88%;max-height:23vh;overflow:auto;text-align:center;color:#bff8ff;font-size:clamp(14px,2.4vw,22px);text-shadow:0 0 10px #54e9ff;z-index:5}.badge{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:8px 14px;border:1px solid #56eaff55;border-radius:999px;background:#081522cc;color:#aef6ff;z-index:5;font-size:13px}
#setup{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#02060aee;overflow:auto}.card{width:min(620px,100%);padding:25px;border:1px solid #59eaff55;border-radius:25px;background:#091522;box-shadow:0 0 50px #00c8ff22;text-align:center}.card h1{margin:0 0 10px}.card p{color:#b5d5df;line-height:1.45}.card input,.card textarea{width:100%;padding:14px;margin-top:10px;border-radius:12px;border:1px solid #54e9ff77;background:#020811;color:white;font-size:16px;font-family:inherit}.card textarea{height:150px;resize:vertical}.card button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#0b8daf,#5556d8);color:white;font-size:17px;font-weight:750}.small{font-size:12px!important;opacity:.7}video{position:fixed;width:1px;height:1px;opacity:0}
@media(orientation:portrait){.eye{width:37vw;height:30vw}#eyes{gap:8vw}}
</style></head>
<body><div id="app"><div class="halo"></div><div class="badge" id="mode">Starten…</div><div id="face"><div id="eyes"><div class="eye"><div class="iris"><div class="glint"></div></div><div class="lid top"></div><div class="lid bottom"></div></div><div class="eye"><div class="iris"><div class="glint"></div></div><div class="lid top"></div><div class="lid bottom"></div></div></div><div id="mouth"></div></div><div id="status">Tik op het gezicht als Yellie niet luistert</div><video id="video" autoplay playsinline muted></video></div>
<section id="setup"><div class="card"><h1>Hallo, ik ben Yellie v4.1</h1><p>Zeg één keer <b>“Hey Yellie”</b>. Daarna kun je verder praten. Zeg <b>“vertel mijn gedicht”</b> om je eigen gedicht te horen.</p><input id="key" type="password" autocomplete="off" placeholder="Plak hier je Gemini API-sleutel"><textarea id="poem" placeholder="Schrijf of plak hier jouw eigen gedicht…"></textarea><button id="start">Opslaan en Yellie starten</button><button id="fullscreen" type="button">Beeldvullend openen</button><p class="small">De sleutel en het gedicht worden alleen lokaal in deze browser opgeslagen.</p></div></section>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),eyes=[...document.querySelectorAll('.eye')],irises=[...document.querySelectorAll('.iris')],mouth=$('#mouth'),status=$('#status'),mode=$('#mode'),video=$('#video');let key='',poem='',fd=null,stream=null,busy=false,tx=0,ty=0,cx=0,cy=0,rec=null,listening=false,asking=false,speaking=false,wakeMode=true,restartTimer=null,conversationActive=false;let history=[];
function sayStatus(t){status.textContent=t}function look(x,y){tx=Math.max(-1,Math.min(1,x));ty=Math.max(-1,Math.min(1,y))}function anim(){cx+=(tx-cx)*.14;cy+=(ty-cy)*.14;irises.forEach(i=>i.style.transform=`translate(calc(-50% + ${cx*34}%),calc(-50% + ${cy*27}%))`);requestAnimationFrame(anim)}anim();
function blink(){eyes.forEach(e=>e.classList.add('blink'));setTimeout(()=>eyes.forEach(e=>e.classList.remove('blink')),150)}(function bl(){setTimeout(()=>{blink();bl()},2800+Math.random()*3800)})();
function splitSpeech(t){const s=String(t||'').replace(/\s+/g,' ').trim(),out=[];for(let p of(s.match(/[^.!?;:]+[.!?;:]*/g)||[s])){p=p.trim();while(p.length>145){let i=p.lastIndexOf(' ',145);if(i<55)i=145;out.push(p.slice(0,i).trim());p=p.slice(i).trim()}if(p)out.push(p)}return out}
function speak(t,after){speaking=true;stopRecognition();sayStatus(t);speechSynthesis.cancel();const parts=splitSpeech(t);let i=0,finished=false;mouth.classList.add('talk');function done(){if(finished)return;finished=true;mouth.classList.remove('talk');speaking=false;setTimeout(()=>after?after():(conversationActive?startQuestion():startWake()),700)}function next(){if(i>=parts.length){done();return}const u=new SpeechSynthesisUtterance(parts[i++]);u.lang='nl-NL';u.rate=.95;u.pitch=.86;u.onend=()=>setTimeout(next,70);u.onerror=()=>setTimeout(next,70);speechSynthesis.speak(u)}next()}
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();fd=new FaceDetection({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}`});fd.setOptions({model:'short',minDetectionConfidence:.55});fd.onResults(r=>{busy=false;const d=r.detections&&r.detections[0];if(d){const b=d.boundingBox;look(-(b.xCenter*2-1),(b.yCenter*2-1)*.9)}});cameraLoop()}catch(e){sayStatus('Camera: '+e.name+' '+e.message)}}async function cameraLoop(){if(fd&&video.readyState>=2&&!busy){busy=true;try{await fd.send({image:video})}catch(e){busy=false}}requestAnimationFrame(cameraLoop)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;function makeRec(){if(!SR)return null;const r=new SR();r.lang='nl-NL';r.interimResults=false;r.maxAlternatives=1;return r}function stopRecognition(){clearTimeout(restartTimer);if(rec){rec.onend=null;try{rec.stop()}catch(e){}rec=null}listening=false}
function isWake(t){return t.includes('hey yellie')||t.includes('hé yellie')||t.includes('hee yellie')||t.includes('hey jellie')||t.includes('hé jellie')||t.includes('hee jellie')||t.includes('hey jelly')}
function startWake(){if(!SR||speaking||asking)return;stopRecognition();wakeMode=true;mode.textContent='Luistert naar “Hey Yellie”';sayStatus('Zeg “Hey Yellie” of tik op het gezicht');rec=makeRec();rec.continuous=true;rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript.toLowerCase().trim();if(isWake(t)){stopRecognition();conversationActive=true;speak('Ja?',startQuestion);return}}};rec.onerror=e=>{listening=false;if(!['no-speech','aborted'].includes(e.error)){mode.textContent='Tik om te luisteren';sayStatus('Microfoon: '+e.error)}};rec.onend=()=>{listening=false;mode.textContent='Tik of zeg “Hey Yellie”'};try{rec.start();listening=true}catch(e){mode.textContent='Tik om te luisteren'}}
function handleCommand(text){const low=text.toLowerCase().replace(/[.,!?]/g,'').trim();if(low.includes('vertel mijn gedicht')||low.includes('lees mijn gedicht')||low.includes('draag mijn gedicht voor')){if(poem)speak(poem,startQuestion);else speak('Er is nog geen gedicht opgeslagen.',startQuestion);return}if(low.includes('stop gesprek')||low.includes('tot ziens yellie')||low.includes('slaap maar yellie')){conversationActive=false;history=[];speak('Tot de volgende keer!',startWake);return}ask(text)}
function startQuestion(){if(!SR||speaking||asking)return;stopRecognition();wakeMode=false;conversationActive=true;mode.textContent='Gespreksmodus: ik luister';sayStatus('Praat maar verder…');rec=makeRec();rec.continuous=false;let handled=false;rec.onresult=e=>{handled=true;const t=e.results[0][0].transcript.trim();stopRecognition();if(t)handleCommand(t)};rec.onerror=e=>{listening=false;if(e.error==='aborted')return;mode.textContent='Tik om verder te praten';sayStatus(e.error==='no-speech'?'Ik hoorde niets. Tik op mijn gezicht om verder te praten.':'Microfoon: '+e.error+'. Tik om verder te praten.')};rec.onend=()=>{listening=false;if(!handled){mode.textContent='Tik om verder te praten';sayStatus('Tik op mijn gezicht om verder te praten.')}};try{rec.start();listening=true}catch(e){mode.textContent='Tik om verder te praten';sayStatus('Tik op mijn gezicht om verder te praten.')}}
async function ask(text){asking=true;mode.textContent='Yellie denkt na';sayStatus('Jij: '+text);history.push({role:'user',parts:[{text}]});if(history.length>10)history=history.slice(-10);const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const url=`https://generativelanguage.googleapis.com/v1/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(key)}`;const body={system_instruction:{parts:[{text:'Je bent Yellie, een vriendelijke en speelse robot op een tablet. Voer een natuurlijk doorlopend gesprek in het Nederlands. Gebruik eerdere berichten als context. Antwoord duidelijk, bondig en zonder markdown.'}]},contents:history,generationConfig:{temperature:.8,maxOutputTokens:500}};const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});const data=await resp.json();if(!resp.ok)throw new Error(data.error?.message||('HTTP '+resp.status));const ans=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join(' ').trim();if(!ans)throw new Error('Geen antwoord ontvangen');history.push({role:'model',parts:[{text:ans}]});if(history.length>10)history=history.slice(-10);asking=false;mode.textContent='Yellie praat';speak(ans,startQuestion)}catch(e){history.pop();asking=false;const msg=e.name==='AbortError'?'De AI reageerde niet binnen twintig seconden.':'AI-fout: '+e.message;speak(msg,startQuestion)}finally{clearTimeout(timer)}}
function activateByTap(){if($('#setup').style.display!=='none'||asking||speaking)return;conversationActive=true;stopRecognition();startQuestion()}
$('#face').addEventListener('pointerdown',activateByTap);$('#fullscreen').onclick=async e=>{e.stopPropagation();try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(err){sayStatus('Gebruik in Chrome: menu, Toevoegen aan startscherm, voor openen zonder adresbalk.')}};$('#start').onclick=async e=>{e.stopPropagation();key=$('#key').value.trim();poem=$('#poem').value.trim();if(!key){sayStatus('Vul eerst je Gemini API-sleutel in');return}localStorage.setItem('yellieGeminiKey',key);localStorage.setItem('yelliePoem',poem);$('#setup').style.display='none';mode.textContent='Camera starten';await startCamera();speak('Hallo, ik ben Yellie. Zeg Hey Yellie als je iets wilt vragen.',startWake)};const saved=localStorage.getItem('yellieGeminiKey');if(saved)$('#key').value=saved;const savedPoem=localStorage.getItem('yelliePoem');if(savedPoem){$('#poem').value=savedPoem;poem=savedPoem}
})();
</script></body></html>
