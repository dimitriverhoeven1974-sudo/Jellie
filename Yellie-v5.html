<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02050a"><meta name="mobile-web-app-capable" content="yes"><title>Yellie v4</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#eaffff;font-family:system-ui,sans-serif}body{background:radial-gradient(circle at 50% 40%,#173356,#07111e 48%,#02050a)}#app{height:100%;display:grid;place-items:center}.badge{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:8px 14px;border:1px solid #56eaff66;border-radius:999px;background:#081522dd;z-index:5;white-space:nowrap}#face{display:flex;flex-direction:column;align-items:center;gap:80px;cursor:pointer}.eyes{display:flex;gap:8vw}.eye{position:relative;width:clamp(130px,27vw,300px);height:clamp(105px,21vw,235px);border:8px solid #62edff;border-radius:48%;background:#04111d;box-shadow:0 0 20px #5deaff,0 0 60px #00c8ff66;overflow:hidden}.iris{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#02060a 0 27%,#c8ffff 29% 35%,#28dfff 37% 62%,#073a57 65%);box-shadow:0 0 20px #52eaff}.glint{position:absolute;left:20%;top:14%;width:22%;aspect-ratio:1;border-radius:50%;background:white}.lid{position:absolute;z-index:2;left:-3%;width:106%;height:55%;background:#0b1929;transition:.12s}.top{top:-2%;transform:translateY(-105%)}.bottom{bottom:-2%;transform:translateY(105%)}.blink .top,.blink .bottom{transform:translateY(0)}#mouth{width:190px;height:35px;border-bottom:10px solid #55eaff;border-radius:0 0 60% 60%;filter:drop-shadow(0 0 10px #55eaff)}#mouth.talk{animation:talk .18s infinite alternate}@keyframes talk{to{width:150px;height:75px;border:7px solid #55eaff;border-radius:50%;background:#03121d}}#status{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);width:90%;max-height:25vh;overflow:auto;text-align:center;color:#bff8ff;font-size:clamp(15px,2.4vw,22px);line-height:1.35}#setup{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#02060af2;overflow:auto}.card{width:min(620px,100%);padding:23px;border:1px solid #59eaff55;border-radius:24px;background:#091522;text-align:center}.card p{color:#b5d5df}.card input,.card textarea{width:100%;padding:13px;margin-top:10px;border-radius:12px;border:1px solid #54e9ff77;background:#020811;color:white;font:inherit}.card textarea{height:150px;resize:vertical}.card button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#0b8daf,#5556d8);color:white;font-size:17px;font-weight:750}.small{font-size:12px}video{position:fixed;width:1px;height:1px;opacity:0}
</style></head><body><div id="app"><div class="badge" id="mode">Starten…</div><div id="face"><div class="eyes"><div class="eye"><div class="iris"><div class="glint"></div></div><div class="lid top"></div><div class="lid bottom"></div></div><div class="eye"><div class="iris"><div class="glint"></div></div><div class="lid top"></div><div class="lid bottom"></div></div></div><div id="mouth"></div></div><div id="status">Druk op Yellie starten</div><video id="video" autoplay playsinline muted></video></div>
<section id="setup"><div class="card"><h1>Hallo, ik ben Yellie v4</h1><p>Zeg één keer <b>“Hey Yellie”</b>. Daarna kun je blijven doorpraten. Zeg <b>“vertel mijn gedicht”</b> om je eigen tekst te horen.</p><input id="key" type="password" autocomplete="off" placeholder="Gemini API-sleutel"><textarea id="poem" placeholder="Schrijf of plak hier jouw eigen gedicht…"></textarea><button id="start">Gedicht opslaan en Yellie starten</button><p class="small">Je API-sleutel en gedicht worden alleen lokaal in deze browser opgeslagen.</p></div></section>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),mode=$('#mode'),status=$('#status'),mouth=$('#mouth'),setup=$('#setup');let key='',poem='',rec=null,speaking=false,asking=false,conversation=false,timer=null,history=[];const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function show(t){status.textContent=t}function stopRec(){clearTimeout(timer);if(rec){rec.onend=null;try{rec.abort()}catch(e){}rec=null}}
function split(t){const out=[];for(let p of(String(t||'').replace(/\s+/g,' ').trim().match(/[^.!?;:]+[.!?;:]*/g)||[])){p=p.trim();while(p.length>145){let i=p.lastIndexOf(' ',145);if(i<55)i=145;out.push(p.slice(0,i));p=p.slice(i).trim()}if(p)out.push(p)}return out}
function speak(text,after){stopRec();speechSynthesis.cancel();show(text);speaking=true;mode.textContent='Yellie praat';mouth.classList.add('talk');const parts=split(text);let i=0,ended=false;function finish(){if(ended)return;ended=true;speaking=false;mouth.classList.remove('talk');setTimeout(()=>after?after():(conversation?listen():wake()),600)}function next(){if(i>=parts.length)return finish();const u=new SpeechSynthesisUtterance(parts[i++]);u.lang='nl-NL';u.rate=.95;u.pitch=.86;u.onend=()=>setTimeout(next,80);u.onerror=()=>setTimeout(next,80);speechSynthesis.speak(u)}next()}
function makeRec(){if(!SR)return null;const r=new SR();r.lang='nl-NL';r.interimResults=false;r.maxAlternatives=1;return r}
function wake(){if(!SR||speaking||asking)return;conversation=false;stopRec();mode.textContent='Zeg “Hey Yellie”';show('Zeg “Hey Yellie” of tik op het gezicht');rec=makeRec();rec.continuous=true;rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript.toLowerCase();if(/(hey|hé|hee) (yellie|jellie|jelly)/.test(t)){conversation=true;stopRec();speak('Ja?',listen);return}}};rec.onerror=e=>{if(!['aborted','no-speech'].includes(e.error))show('Microfoon: '+e.error)};rec.onend=()=>{if(!conversation&&!speaking&&!asking)timer=setTimeout(wake,800)};try{rec.start()}catch(e){timer=setTimeout(wake,900)}}
function listen(){if(!SR||speaking||asking)return;conversation=true;stopRec();mode.textContent='Gespreksmodus: ik luister';show('Praat maar verder…');rec=makeRec();rec.continuous=false;let handled=false;rec.onresult=e=>{handled=true;const text=e.results[0][0].transcript.trim();stopRec();handleCommand(text)};rec.onerror=e=>{if(e.error==='no-speech'){mode.textContent='Tik om verder te praten';show('Ik hoorde niets. Tik op mijn gezicht om verder te praten.')}else if(e.error!=='aborted')show('Microfoon: '+e.error)};rec.onend=()=>{if(!handled)mode.textContent='Tik om verder te praten'};try{rec.start()}catch(e){show('Tik op mijn gezicht om verder te praten.')}}
function handleCommand(text){const low=text.toLowerCase().replace(/[.,!?]/g,'').trim();if(low.includes('vertel mijn gedicht')||low.includes('lees mijn gedicht')||low.includes('draag mijn gedicht voor')){if(poem.trim())speak(poem,listen);else speak('Er is nog geen gedicht opgeslagen. Open Yellie opnieuw en vul je gedicht in.',listen);return}if(low.includes('stop gesprek')||low.includes('tot ziens yellie')){conversation=false;history=[];speak('Tot de volgende keer!',wake);return}ask(text)}
async function ask(text){asking=true;mode.textContent='Yellie denkt na';show('Jij: '+text);history.push({role:'user',parts:[{text}]});if(history.length>10)history=history.slice(-10);const c=new AbortController(),to=setTimeout(()=>c.abort(),20000);try{const url=`https://generativelanguage.googleapis.com/v1/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(key)}`;const body={system_instruction:{parts:[{text:'Je bent Yellie, een vriendelijke robot. Voer een natuurlijk doorlopend gesprek in het Nederlands. Antwoord duidelijk en zonder markdown.'}]},contents:history,generationConfig:{temperature:.8,maxOutputTokens:500}};const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'HTTP '+r.status);const ans=d.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join(' ').trim();if(!ans)throw Error('Geen antwoord ontvangen');history.push({role:'model',parts:[{text:ans}]});asking=false;speak(ans,listen)}catch(e){history.pop();asking=false;speak(e.name==='AbortError'?'De AI reageerde niet op tijd.':'AI-fout: '+e.message,listen)}finally{clearTimeout(to)}}
$('#face').addEventListener('pointerup',()=>{if(setup.style.display!=='none'||asking)return;if(speaking){speechSynthesis.cancel();speaking=false;mouth.classList.remove('talk')}conversation=true;setTimeout(listen,200)});$('#start').addEventListener('click',e=>{e.preventDefault();key=$('#key').value.trim();poem=$('#poem').value.trim();if(!key){show('Vul eerst je Gemini API-sleutel in.');return}localStorage.setItem('yellieGeminiKey',key);localStorage.setItem('yelliePoem',poem);setup.style.display='none';speak('Hallo, ik ben Yellie. Zeg Hey Yellie om ons gesprek te beginnen.',wake)});$('#key').value=localStorage.getItem('yellieGeminiKey')||'';$('#poem').value=localStorage.getItem('yelliePoem')||'';poem=$('#poem').value;
})();</script></body></html>
