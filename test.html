<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jellie v2</title><style>body{margin:0;background:#08111f;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh}#wrap{text-align:center}button,input{padding:12px;margin:6px;font-size:16px}#log{white-space:pre-wrap;max-width:800px;background:#111;padding:10px;border-radius:8px}</style></head><body><div id="wrap"><h1>Jellie v2</h1><input id="apikey" placeholder="Gemini API key"><br><button id="start">Start Jellie</button><button id="speakBtn">TTS Test</button><div id="log">Klaar</div></div><script>const log=t=>document.getElementById('log').textContent=t;let rec=null,speaking=false;function stopRecognition(){if(rec){try{rec.stop()}catch(e){} rec=null}}function startWake(){log('Wake-word modus actief')}function speak(text,after){if(!text)return;speaking=true;stopRecognition();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='nl-NL';u.rate=.9;u.pitch=.9;u.volume=1;u.onstart=()=>log('TTS START
'+text);u.onend=()=>{log('TTS EINDE');speaking=false;setTimeout(()=>{if(after)after();else startWake();},1000)};u.onerror=e=>{log('TTS FOUT: '+e.error);speaking=false};speechSynthesis.speak(u)}document.getElementById('speakBtn').onclick=()=>speak('Hallo Dimitri. Dit is Jellie versie twee. Deze volledige zin moet zonder onderbrekingen worden uitgesproken.');document.getElementById('start').onclick=()=>{speak('Hallo Dimitri. Jellie versie twee is gestart.');};</script></body></html>
