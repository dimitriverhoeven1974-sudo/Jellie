<!DOCTYPE html>
<html>
<body>

<button onclick="testTTS()">
TTS TEST
</button>

<pre id="out"></pre>

<script>

function testTTS(){

    const voices =
        speechSynthesis.getVoices();

    document.getElementById("out").textContent =
        "Aantal stemmen: " +
        voices.length +
        "\n\n" +
        voices.map(v =>
            v.name + " | " + v.lang
        ).join("\n");

    const u =
        new SpeechSynthesisUtterance(
            "Hallo Dimitri. Ik ben J-ellie. ik kan ook super lange teksten uitspreken, zonder dat ik steeds een pauze houd tussendoor"
        );

    u.lang = "nl-NL";

    u.onstart = () => {

        console.log("start");

    };

    u.onend = () => {

        console.log("einde");

    };

    u.onerror = e => {

        alert(
            "TTS fout: " +
            e.error
        );

    };

    speechSynthesis.speak(u);
}

</script>

</body>
</html>
